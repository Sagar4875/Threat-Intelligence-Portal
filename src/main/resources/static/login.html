<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Threat Intelligence Portal | Login</title>

    <link rel="stylesheet"
          href="../css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-left">

        <div class="branding">

            <i class="fa-solid fa-shield-halved logo-icon"></i>

            <h1>Threat Intelligence Portal</h1>

            <p>

                Securely monitor, manage, and analyze cyber threats through a centralized platform.

            </p>

        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>Sign in to continue</p>

            <form id="loginForm">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required>

                        <i id="togglePassword"
                           class="fa-solid fa-eye"></i>

                    </div>

                </div>
                <!-- Remember Me -->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                                type="checkbox"
                                id="rememberMe">

                        Remember Me

                    </label>

                    <a href="#"
                       class="forgot-password">

                        Forgot Password?

                    </a>

                </div>

                <!-- Error Message -->

                <div id="errorMessage"
                     class="error-message">

                </div>

                <!-- Login Button -->

                <button
                        type="submit"
                        id="loginBtn"
                        class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

                <!-- Loading -->

                <div id="loading"
                     class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Authenticating...

                </div>

            </form>

            <div class="login-footer">

                <p>

                    © 2026 Threat Intelligence Portal

                </p>

                <small>

                    Secure Cyber Threat Management System

                </small>

            </div>

        </div>

    </div>

</div>

<script src="../js/login.js"></script>

</body>

</html>
