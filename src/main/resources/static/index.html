<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Threat Intelligence Portal</title>

    <!-- CSS -->
    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">

            <i class="fa-solid fa-shield-halved"></i>

            <h1>Threat Intelligence Portal</h1>

            <p>Cyber Threat Management System</p>

        </div>

        <form id="loginForm">

            <div class="input-box">

                <label>Email Address</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required>

            </div>

            <div class="input-box">

                <label>Password</label>

                <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required>

            </div>

            <button
                    type="submit"
                    class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

        <div class="footer">

            <p>Threat Intelligence Portal (TIP)</p>

            <p>Developed Using Java • JDBC • MySQL</p>

        </div>

    </div>

</div>


<script src="js/login.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
